name: Build desktop apps

# Builds the TallyReel installers for Windows and Mac. It lives in this public repository because
# GitHub Actions minutes are free here; the app's source stays in the private repository and is read
# with a read-only deploy key (secret TALLYREEL_SOURCE_KEY). Revoke that key in the private repo's
# Settings > Deploy keys to cut this off.
#
# Run it by hand only (Actions > Build desktop apps > Run workflow) and give it a tag or branch of
# the private repository. It never runs for pull requests, so nobody else can reach the key.
# Publishing is a separate step on the release Mac (apps/studio/scripts/publish_release.py), where
# the update-signing key lives; it takes the installers from this run.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch of SoonBuilt/tallyreel to build, e.g. v1.0.3"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/apps/studio

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"   # the shipped app runs in UTF-8 mode too (tallyreel.spec); test the same way
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SoonBuilt/tallyreel
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TALLYREEL_SOURCE_KEY }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          # DirectML build of ONNX Runtime: GPU acceleration on NVIDIA, AMD and Intel graphics (falls back to CPU)
          pip uninstall -y onnxruntime
          pip install onnxruntime-directml
      - name: Unit tests
        run: |
          pip install pytest
          python -m pytest -q tests
      - name: Engine test (script, voice, captions, render on Windows)
        run: python scripts/engine_test.py
        env:
          TALLYREEL_DATA: ${{ runner.temp }}\tallyreel-test
      - name: Build with PyInstaller
        run: pyinstaller packaging/tallyreel.spec --noconfirm --workpath build --distpath dist
      - name: Smoke test (engine imports inside the bundle)
        shell: pwsh
        run: |
          $env:TALLYREEL_SMOKE_TEST = "1"
          $p = Start-Process dist\TallyReel\TallyReel.exe -PassThru -Wait -NoNewWindow `
               -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke-out.txt -ErrorAction SilentlyContinue
          Get-Content smoke-err.txt -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\tallyreel.iss
      - uses: actions/upload-artifact@v4
        with:
          name: TallyReel-windows
          path: src/apps/studio/dist/TallyReel-*-windows-x64-setup.exe

  mac:
    runs-on: macos-14   # Apple silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SoonBuilt/tallyreel
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.TALLYREEL_SOURCE_KEY }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-mac.txt
          .venv/bin/pip install --no-deps chatterbox-tts==0.1.7
      - name: Unit tests
        run: |
          .venv/bin/pip install pytest
          .venv/bin/python -m pytest -q tests
      - name: Build app and DMG
        run: packaging/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TallyReel-mac
          path: src/apps/studio/dist/TallyReel-*-mac-arm64.dmg
